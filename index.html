html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 56px);height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,"Times New Roman",serif;-webkit-text-size-adjust:100%}

header .t{flex:1;text-align:center;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
button{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;min-height:38px}
button:active{transform:scale(.97)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button[disabled]{opacity:.35;pointer-events:none}
#bar{position:absolute;left:0;bottom:-1px;height:3px;width:0;background:var(--accent)}
#panel{position:fixed;right:10px;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:12;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:none;gap:8px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#panel.open{display:flex}
main{max-width:680px;margin:0 auto;padding:20px 18px 60px}
.hero{text-align:center;padding:28px 0 18px}
.hero h1{font-size:40px;margin:0 0 6px;letter-spacing:.5px}
.hero p{margin:4px 0;color:var(--muted);font-style:italic}
.orn{color:var(--accent);letter-spacing:8px;margin:14px 0}
.cta{display:flex;gap:10px;justify-content:center;margin:12px 0 22px;flex-wrap:wrap}
h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin:10px 0}
.card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px;margin:0 0 10px;border-radius:14px;background:var(--surface)}
.card .n{flex:none;width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.card .nm{flex:1;font-size:18px}
.card .m{font-size:13px;color:var(--muted);white-space:nowrap}
.card.done .n{background:var(--muted)}
.ch h1{text-align:center;font-size:30px;margin:14px 0 4px}
.ch .no{text-align:center;color:var(--accent);font-size:13px;letter-spacing:3px;text-transform:uppercase}
.stanza{margin:0 0 1.15em}
.prose{margin:0 0 1em;line-height:1.7;text-indent:1.4em}
.stanza span{display:block;padding-left:1.4em;text-indent:-1.4em;line-height:1.65}
.nav{display:flex;justify-content:space-between;gap:10px;margin:26px 0 8px}
.nav button{flex:1}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:30px}
</style>

ı, birewdi birew jeytuǵın zaman boldı. Salıp qoyǵan qala joq, jerden aqır qazdı, arbadan qamal qılıp, dárwazanı bir jerden qoyıp, qamal qoyatuǵın bálege ushıradı. Alpamıstıń etetuǵın isi joq, ıńıranatuǵın keseli joq, kúnde azanda dárwazaǵa shıǵadı, dárwazanı ańlıydı, kúndegi talabı sol: otınǵa, suwǵa shıqqan qız bolsa, moyınına qol salıp, hár betinen posa alıp, moyınınan qushaqlap, betlerin tislep, tula boyın kók-kómbek qılıp jiberetuǵın bálege ushıradı. Bala-shaǵa maydanǵa shıǵa almaytuǵın, óz jawı ózinen shıqqan mańlayı qara qala sol boldı."},{"t":"p","x":"Baybóri baydıń jaqınıraq bir kelini bar edi:"},{"t":"v","x":["Toppısı tozǵan,","Gellesi qozǵan,","Eki dizesi qulaǵınan zárre ozǵan,","Kózleri máshtey,","Shandırı tastay,"]},{"t":"p","x":"Kóp bir quwqıl, mańlayı qara kempir edi, er jetken eki qızı bar edi, otınǵa bar dese, barmaydı, kempirdiń tilin almaydı, qızları aytqanın qılmaǵan soń, kempirge ne turıs:"},{"t":"p","x":"- Qırshınıńnan qıyılǵır-aw, shıbıǵıńnan shırpılǵır-aw, eki birdey urǵashı, suwǵa nege barmaysız, otınǵa nege barmaysız? - deydi."},{"t":"p","x":"Sol waqıtta qızları:"},{"t":"p","x":"-Ap-aw! Otını da qurısın, suwı da qurısın, bizler neǵıp barayıq. Mına Bóybóri baydıń júwernemek, urnıqqırı Alpamıs degen balası bar-aw deymen, arman ótsek te qoymaydı, berman ótsek te qoymaydı, moynımızǵa qol salıp, hár betimizden posa alıp, moyınımızdan qushaqlap, betimizden tislep, kúnde tula boyımızdı kók-kómbek qılıp jiberedi, - deydi."},{"t":"p","x":"- Way, qudaydıń ólimi kelgir júwernemek-aw, - deydi kempir. - Awılda bala- shaǵanı qoymay júrgenshe, qalmaqtan qatının alıp kelse bolmay ma? - deydi. - Sizler qabaǵıńızdı alıp, aldıma túsiń, ózim onıń júregine shay tartqanday qılıp qaytayın, - deydi."},{"t":"p","x":"Sol waqıtta mama góne mási, góne gúpi, góne toppı - bárshesin kiyip, dákenesii haywanqaslap, halaqasın uzın taslap, jawlıǵın qıya jamılıp, hasanı beline salıp júre beredi, qabaǵın iynine salıp, qızları hám aldına tústi, qızlar dárwazaǵa burınıraq bardı, eki qızdı kórgen soń, kúndegidey diyxanshılıqtı qoysın ba:"},{"t":"v","x":["- Kórgenshe joqtı qararım,","Taymaǵay bastan dáwranım,","Munsha nege keshiktiniz,","Eki birdey nazlı yarım?"]},{"t":"p","x":"- dep, moyınǵa qol saldı, hár betinen posa aldı, moyınınan qushaqlap, betinen tisledi, kempir barǵansha qızlardıń tula boyın kók-kómbek qıldı. Sol waqıtta mamanıń ashıwı kelip, Alpamısqa ǵıjalat berip, qajap sóylep turǵan usaydı:"},{"t":"v","x":["-Xalqıńızdıń jarpın sorsań qıyattı,","Atańnıń dáwranı jurttan zıyattı,","Bizin qızǵa maldı aydap bergendey,","Qáynim, mına isiń jurttan uyattı."]},{"t":"v","x":["Qarqaram bar bul basımda shoqtan-shoq,","Men jılayman jaratqanǵa, qayǵım kóp,","Baysın elde eki teńles bay edi,","Bileseń be, biri bar da, biri joq."]},{"t":"v","x":["Bul jerlerde shekken jábir-japańız,","Ashıqqa jarasqan zawqı-sapańız,","Atań menen qaynatań óz toyında urısıp,","Qalmaqqa kóship ketti qáyin atanız."]},{"t":"v","x":["Bedew mingen márttiń júregi tasar","Yarınap ayırılǵan aqlınan sasar,","Uzaq jerden esitip júrmen ǵalawıt,","Barshınjanım qalmaqta qız bolǵan,","Qarajan menen Tayshıxanlar talasar."]},{"t":"v","x":["Bedew minip, qıya shólde jelseńe,","Búytip júrgenshe sen, qáynim, ólseńe,","Awıldaǵı bala-shaǵanı qoymay júrgenshe,","Qalmaqtaǵı qatınıńdı alıp kelseńe."]},{"t":"v","x":["Jetalmassań, jolıń mánzilden jıraq,","Barshınjan júrgendi kelgey dep jılap,","Bunnan barıp kelindi alıp kelmeseń,","Júwernemek jer tartqır-aw,","Kiymeshekli qatın sennen jaqsıraq."]},{"t":"p","x":"Sol waqıtta Alpamıstıń reńi sarǵayıp, kewli pás túsip, sebil boz ordasına bardı. Sol waqıtta, jalǵız bala sarǵayıp otırǵan soń, ne isheseń, ne jeysen, qay jeriń awırıp tur, degenlerge Alpamıs:"},{"t":"p","x":"- Quwırmash kuwırıp ber, apa, - dedi."},{"t":"p","x":"Sol waqıtta, jalǵız balanıń sózi jerde qala ma, qazannıń basına bara qaldı, maydı qazanǵa saldı, arbashı yabıday qazandı qaptallap tura qaldı."},{"t":"p","x":"May kúygen waqıtta biydaydı jelpip mayǵa quyıp jiberdi. Oyaǵın daǵlap, buyaǵın daǵlap, aldı qızarıp, keyni sarǵayǵan waqıtta:"},{"t":"p","x":"- Shıraǵım, qattı ma, bos pa, pisti me, shiyki me? - dep, bir qasıq quwırmashtı uzattı."},{"t":"p","x":"- Mańlayı qara, seniń kir kasıǵıń menen quwırmashıńdı jeytuǵınbedim? - deydi bala."},{"t":"p","x":"Sol waqıtta elbirep-delbirep, bir uwıs quwırmashtı qolı menen uzattı. Balanıń júregi tastı, qolı kúyip baratır, kempir ólip baratır. Qolın qattıraq qısıp:"},{"t":"p","x":"- Apa, maǵan qız aldıńız ba? - dep soradı."},{"t":"p","x":"- Óybey, alıp edik, - dep aytıp-aq saldı."},{"t":"p","x":"- Qayda ketti?"},{"t":"p","x":"- Atań menen qáyin atań toyında urısıp, qalmaqqa kóship ketti, balam, - deydi."},{"t":"p","x":"Sonnan soń quwırmashın ne qılsın, tillá erdi iynine saldı, jez bawırdaq qamshını qolına aldı, ózin kóterip ósirgen qul atasın Qultay qul dep at beretuǵın edi, hámme eldin shetinde, Aqbulaqtıń boyında jılqı baǵıp jatatuǵın edi."},{"t":"p","x":"Payıw-piyada, er arqalap, qamshı alıp, atlı barmas jerlerge erte pesin waqıtta piyada bardı Alpamıs. Baba jigerbenti jalǵız Alpamıstın tillá er iyninde, jez bawırdaq qamshı qolında, sarǵayıp jortıp kiyatırǵanın kórip:"},{"t":"p","x":"- Jigerbentim, jalǵızım, piyada nege kiyatır eken, balamnan jol bolsın sorap kóreyin, - dep, Alpamıstıń qasına kelip, jol bolsın sorap turǵan usaydı:"},{"t":"v","x":["- Hawa jawsın, aydın kóller hól bolsın,","Jıldan-jılǵa az dáwletiń mol bolsın,","Kórinedi tillá eriń iynińde,","Jigerbentim, jalǵız balam, jol bolsın?"]},{"t":"v","x":["Taza tarlan talpınadı uyada,","Hesh bir bende sarǵaymasın qıyada,","Kórinedi tillá eriń iynińde,","Nege keldin, jalǵızım, payıw-piyada?"]},{"t":"v","x":["Batır gezer daǵıstannan jol salıp,","Ashıq oynar aq siyneden qol salıp,","Arqalapsań tillá erdi iynińe,","Oń qolıńa jez bawırdaq qamshı alıp."]},{"t":"v","x":["Áne sol waqta bala sóyleydi:"]},{"t":"v","x":["Aqılım boldı meniń lal,","Kewilińde bar ma qıylı-qal,","Arzımdı esit, jan ata,","Saǵan bir aytar arzım bar.","Atam bir sıqmar kisi eken,","Aytlar, toylar bolǵanda,","Teń qurbılar kelgende,","Júr jora, dep turǵanda,","Mingendey at bermeydi,","Kiygendey ton bermeydi,","Urısarsań sen, deydi,","Keyiserseń sen, deydi,","Birewdiń toyın buzarsań, dep,","Jibermeydi bizlerdi.","Aqsha babam toy bergen,","Xat jiberip shaqırǵan,","Alpamısjan kelsin dep,","Mına bergen toyımnıń,","Mirapbısı bolsın den,","Júz jigit keldi úyime.","Mineyin desem, atım joq,","Kiyeyin desem, zatım joq,","Qalar boldım piyada,","Eglenip turıń begler dep,","Keldim seniń qasıńa.","At kekilin tarayman,","Jalǵızban, tilge jarayman,","Taqımım meniń tolǵanday,","Xızmetime bolǵanday,","Mına baqqan jılqıńnan,","Qabırǵalı bir yabı,","Sennen baba sorayman."]},{"t":"p","x":"Sol wakıtta babası:"},{"t":"p","x":"Bárekella, balam, seniń márt bolǵanıńa shúkir! At minemen dep kámalǵa kelgenińe shúkir! Atań bir mańlayı qara kisi ǵoy, mal kótin qarıslaǵan. Atannıń sıqmarlıǵın sennen kóp jıl burın bilemen, balam."},{"t":"p","x":"Bulaqtıń boyına bar, boyıń shelli bir aqım qaz, boyıńdı jasırıp jat, sáskede jılqınıń aldı tawdan qulap suwǵa keler, sol jerde namazlıgerde suw iship, keyni serpilip qaytar. Taqımıń tolǵanday, xızmetińe bolǵanday, hájetińe jaraǵanday qabırǵalı yabı bolsa, saylap óziń uslap alıp min, balam. Qaysısınıń júyrigin, qaysısınıń shabanın, qaysısınıń jaqsısın, qaysısınıń jamanın men bilmeymen. Atańnıń kóp malı joq, bir mıń ǵana jılqısı bar, balam, - deydi."},{"t":"p","x":"Sol waqıtta bala bulaqtıń boyına barıp, boyı shelli aqımdı qazıp, boyın jasırıp jattı. Ármanlıq penen tań attı, kún shıqtı, sáske boldı, jılqınıń aldı tumsıqtan tawdan qulap, suwǵa keldi, namazlıgerde suw iship, keyni serpilip qayttı."},{"t":"v","x":["Toqımı tolǵanday,","Xızmet kúnge bolǵanday,","Kórinbedi ishinde,","Qabırǵalı bir yabı."]},{"t":"p","x":"- Pay, mańlayı qaranıń jıynaǵan malı haramzada eken! - dep, aqımnan basın kóterse:"},{"t":"v","x":["Ayakları topıshaq,","Quyrık jalı bir qushak,","Júrip joldan adasqan,","Tula boyın kene basqan,","Mezgillik joldı ańlaǵan," n emdim payımdı,","Hawalaǵan altı ǵazdı kórgenmen,","Alıp ber, ene, tuqtıy menen jayımdı."]},{"t":"v","x":["Sarı jaydı men iynime salayın,","Tuqtıyımdı ash belime shalayın,","Tuqtıy menen jaydı alıp ber, enejan,","Altı ǵazdı ózim atıp alayın."]},{"t":"v","x":["Onda enesi ne deydi:"]},{"t":"v","x":["- Ǵarrılıqtan men de boldım biyqarar,","Ǵazdı kórip, bolma balam giriptar,","Bir tilegim, atagórme ǵazlardı,","Zindandaǵı Alpamıstıń xatı bar.","Kewilińe almaǵıl zárre qararıń,","Atsań tayar basıńdaǵı dáwranıń,","Atsań, sen bolarsan qan qarızdar,","Sen bereseń amanattıń zawalın."]},{"t":"v","x":["Alıstan kóringen tawdıń qıyaǵı,","Tas qaqsa súriner attıń doynaǵı,","Bir tilegim sennen meniń,","Altı ǵazdı atagórme, shıraǵım."]},{"t":"p","x":"Sol waqıtta Shekamannın ashıwı keldi:"},{"t":"p","x":"- Mańlayı qara, aljıǵan, teris qaytqan, tezirek alıp ber! Atım jaydan óter boldı altı ǵaz, julayın ba shashıńdı, taslarman shólge lashındı."},{"t":"p","x":"Sol waqları enesi, Shekamanday balasın, Jer toqpaqlap qarǵadı:"},{"t":"v","x":["- Qırshın janıń qıyılǵır!","Shıbıǵınan shırpılǵır!","Júwernemek bolǵır, jer tartqır!","Ólim bergir ish burıw,","Ish awırıwdan ólgeyseń!","Tilimdi nege almaysań","Sózime qulaq salmaysań,","Qanlar tolǵay kózińe!","Ǵazǵa giriptar qılmaǵay,","Atqan oǵıń, jan balam,","Qaytıp tiygey ózińe! - dep,","Qarǵay berdi enesi.","- Mańlayı qara, aljıǵan,","Men ólgende zar jılap,","Sen qalarsań nıshansız,","Óz balasın qarǵaǵan,","Barmeken sendey iymansız, - dep,","Esikti buzdı Shekaman.","Eneniń tilin almadı,","Jaydı iynine saladı,","Tuqtıydı beline shaladı,","Tentireklep-teńselip,","Dárbentke qarap jónedi.","Mergenge sapar jaqpadı,","Sıypalap kózi tappadı,","Óldim-taldım degende,","Kezesin tawıp aladı,","Tuqtıyınan suwırıp,","Barıp oqlap aladı,","Párli oqtan aladı.","Giriske oqtı qıstırıp,","Atayın dep oylandı,","Hawadaǵı altı ǵaz,","Atım jaydan jániwar,","Zárre ótip baradı.","El shetine keldik, dep,","Biz de aman óttik, dep,","Bir ǵaz turıp ǵańq etti,","Keyninen kelip oq jetti.","Xat kótergen qońır ǵaz,","Baratır eken keyninde,","Quyrıqların julıp ketti,","Ǵańq etpeske táwbe etip,","Ǵazlar bunnan aman ótti.","Shekamannıń atqan oǵı,","Sarqıp ózine jetti,","Qos júrekten oq tiyip,","Ókpesinen tesip ótti,","Qáliydiń kelip aytqanı,","Shekamannıń ájeli jetti.","Ǵazlar sáhár waqıtta,","Hawalap ushıp baratırsa,","Saǵımın kóldiń kóredi,","- Tez jeteyik biz, - deyip,","Sarqıńqırap jamıradı,","Kún orta boldı, jetelmay.","Ǵazlar hayran boladı.","Sáhárde kórgen saǵımǵa,","Pesinde zordan baradı,","Suwdı kórip besewi,","Qarakólge qonadı,","Xat kótergen qońır ǵaz,","Túseyin dese, bolmaydı.","Qanatında xatı bar,","Alpamıstıń atı bar,","- Tússem párim ezilip,","Jazǵan xatı ósher, - dep,","Qarakóldi úsh aylanıp,","Tapsırarǵa janlar tappay,","Bir aylanba qoltıqqa,","Qos párin qıyıp tasladı,","Joldaslarına qosılıp,","Bul da kólge qonadı."]},{"t":"p","x":"Áne, ǵazlar kólde oynap júre berdi. Alpamıstıń qarındası Qansulıw, Alpamıstı kóterip ósirgen qul atası Qultay qul jurttıń qıya shetinde jılqı baǵıp júrer edi."},{"t":"p","x":"Baba júdá gódek adam, jılqınıń bólinip ketkenin bilmeytugın edi, Qansulıw háptede, on kúnde babaǵa jılqı jıynap berip, qaytatuǵın edi."},{"t":"p","x":"Babaǵa jılqını jıynap berip kiyatırsa, nasharǵa bir qıyal payda boldı."},{"t":"p","x":"- Qarakóldi jaǵalay keteyin, arqadan ǵaz kelgen bolsa, aǵamnıń dáregin sorap óteyin dep, at oynatıp kelatırsa, Qansulıw Qarakólde altı ǵazǵa kózi tústi."},{"t":"p","x":"Ǵazdı kórip sóyledi:"},{"t":"v","x":["- Kózlerime jaqtı kúnler tún boldı,","Dushpanlarǵa ústim gúzar jol boldı,","Kórseń meniń ǵayıbımnan xabar ber,","Jan aǵam ketkeli eki jıl boldı.","On tórtimde juwǵan shashım tarayın,","Nashar basım ne kúnlerge jarayın,","Aǵam ketip edi, eki jıl boldı,","Kórseń, bilseń, men dáregin sorayın.","Ushqan Mádiyneden ol qońır ǵazlar,","Ólmegen bendege bolǵandı jazlar,","Aǵam ketti meniń eki jıl boldı,","Kórseń, bilseń, xabarın ber, jániwar."]},{"t":"p","x":"Sol waqıtta bir ǵaz toparınan ayırılıp shıǵa berdi. Nasharǵa jaqınlap keldi, ǵaz suwdan júzdi, qız qırdan júrdi, bir aylanba qoltıqqa barǵan waqıtta qırǵa shıqtı. Nasharǵa qarap ǵańqıldap sóylerge tili bolmadı. Sol waqıtta qız jerge qaradı, Qarasa, jerde eki pár kórdi, attan túsip qolına aldı, qarasa, qızıl sıya xatı bar. Aǵasınıń amanlıǵın sol xattı oqıp bildi. Atası menen enesine amanlıǵın bildirdi. Áne, balasının aman ekenligin bilip, ǵarrılardıń waqtı xosh boldı."}]},{"n":16,"name":"XVI bólim","blocks":[{"t":"p","x":"Batır zindanda jata berdi, aradan úsh jıl ótti, bayaǵı dos Qarajan turıp oylandı."},{"t":"p","x":"- Dostım nege kelmedi, ata-enesi qalmaqqa bende boldı, birewdiń arın birewge arlamaq zaman bar ma?"},{"t":"v","x":["Ózimdi shólge dúzeyin,","Hár qıyaldı kózleyin,","Ómirim tuwıp kórmegen,","Alpamıs dostımnıń elin,","Qálender bolıp izleyin,"]},{"t":"v","x":["- degen qıyal payda boldı.","Tal tayaǵın qolına alıp,","Dos sebepli qıyallanıp,","Jolǵa kirdi Qarajan,","Dostın izlep oylanıp.","Batırǵa sapar jaqpadı,","Ómiri tuwıp kórmegen,","Baysınnıń elin tappadı,","Bir elattıń shetinde,","Baratırsa Qarajan,","At shappadı dalada,","Tiline adam túspegen,","Bir máhálde kelipti,","Baysın degen qalaǵa.","Ǵalawıt tústi araǵa,","Jol sorarǵa adam joq."]},{"t":"p","x":"Tappadı. Kóp elattı aralap baratırsa, kórindi bálent bayterek, patshalıqqa múnásip. Bárekellá, Alpamıstın úyi usı bolar, degen qıyalǵa keldi. Usı úyden sorayın dep, bir úydiń esiginiń aldına barıp, tal tayaqqa súyenip, úyge súren saladı:"},{"t":"v","x":["- At shawıp shıqpadım shólge qıyadash,","Nadanlıqtan kózden aqtı selli jas,","Ǵayıptan kelgenmen, táńri miymanman","Bende bolsań boz ordada, xabarlas."]},{"t":"v","x":["Shóldi gezgen ullı gúzar jolmedi,","Baysın degen jatqan aydın kólmedi,","Men de uzaq joldan kelgen miymanman,","Alpamıs dostımnıń úyi usımedi?"]},{"t":"v","x":["Mártlik penen men de kimge jarayın,","Sawash kúni at kekilin tarayın,","Alpamıs dostımnıń úyi usımedi,","Shıq, xabarlas, men dostımdı sorayın."]},{"t":"v","x":["Sol waqta endi Bóybóri,","Tal tayaǵın tayanıp,","Saqalı qanǵa boyalıp,","- Balamnıń atın aytqan kim, - dep,","Maydanǵa shıqtı tolǵanıp,"]},{"t":"p","x":"Maydanǵa shıqsa, esiktiń aldında bir jigit tur, Bóybóri jol bolsın sorap jıladı:"},{"t":"v","x":["- Hawa jawsa, aydın kóller hól bolsın,","Jıldan jılǵa az dáwletiń mol bolsın,","Jalǵızımnıń atın aytqan kim edi,","Ayt, perzentim, saparıńız jol bolsın?"]},{"t":"v","x":["Qarajan:"]},{"t":"v","x":["- Batırlıqtan dúzetemen saltanat,","Kádir allam etpegeydi biymurat,","Sen be ediń Alpamıstıń atası,","Ber qolıńdı, men qılayın ziyarat!"]},{"t":"v","x":["Baybóri:"]},{"t":"v","x":["- Kózlerime ashıq kúnler tún edi,","Din musılman Muhammettiń dini edi,","Perzentimniń atın aytsań shıraǵım,","Eglenbey ayt, seniń atıń kim edi?"]},{"t":"v","x":["Qarajan:"]},{"t":"v","x":["- Men boldım shóllerge ózim talaman,","Dos sebepli men de kúyip janaman,","Alpamıstıń qıyametlik dostıman,","Atımdı sorasań, meniń Qarajan."]},{"t":"v","x":["Ekewimiz de dushpan menen qas boldıq,","Qosılısıp bir birewge es boldıq,","Alpamısjan at shappaǵa barǵanda,","Dárbent jolda qıyametlik dos boldıq."]},{"t":"v","x":["Barshınjanǵa qos shashbawlar órgenbiz,","Márt penen qosılıp dáwran súrgenbiz,","Alpamıs Barshındı alıp qaytqanda,","Júr degende bizler júrmey qalǵanbız."]},{"t":"p","x":"Sol waqıtta Baybóri Qarajannıń moynınan qushaqlap, jalǵızdı kórgen kózińnen, sen de ulım Qarajan, aylansın atań kózińnen, dep Qarajandı úyge kirgizdi."},{"t":"p","x":"- Dostım qayda? - dep edi Qarajan."},{"t":"p","x":"- Úsh jıl boldı ketkeli, óli ekenin bilmedik, tiri ekenin bilmedik, bıyıl gúzek ayında, ǵazdıń qanatında sálem xat keldi, barsań duwayı sálem de dep, jibergen eken jalǵızım. Zindanda jatıptı bánt bolıp, menmenlik kelip ózine, sol boldı kórgen awhalım, - dep Qarajandı sol kúni miyman qılıp kútti."},{"t":"p","x":"Dostıń zindanda qaldı, degen soń Qarajannıń jatıp taqatı bolmadı, yarım aqsham waqtında turıp ketermen boldı."},{"t":"p","x":"Qarındası Qansulıw eglenip turıp, dárkar wájińdi bereyin, dedi. Qarındası Qansulıw iynine dorba asadı, qolına hasa aladı, Qarakóldi jaǵalap, jaǵaǵa qonǵan sharwaǵa qarap jónedi. Hár sharwanın esigine barıp, huw-haq dep, pátiya bergen qusaydı."},{"t":"v","x":["- Nasharman, boldım dárbeder,","Men de bir haqtıń qayǵı sher,","Aǵayin bolsań shıq, dedi,","Esigińe keldi qálender.","Nasharman, boldım aqlım lal,","Allam bir saldı hár qıyal,","Esikke kelgen qálendermen,","Aytqan sózge qulaq sal.","Sawashta mindim qarager,","Jalǵızǵa boldım ahıw-zar,","Aǵayin bolsań bizlerge,","Hár úyge bir-bir tanap ber."]},{"t":"p","x":"Aǵayinlerinen bir-bir tanap jıynadı, alıp kelip Qarajanǵa berdi. Qarajan arqalap qayta berdi, neshe kún jol júrdi, bándirgiden ótti, dostı jatqan zindandı tappay hayran boldı, bir úyilip jatqan topıraqqa kózi tústi, barsa, dostı jatqan zindanǵa dus boldı. Ishkerige qaradı. Ata-enesin saǵınıp, Alpamıs qapa bolıp atır edi. Joqarıǵa qarasa, pánjireniń awzında bir adam kórindi. Sol waqta batır joqarıdaǵı kisige qarap, tolǵap ne dep atır eken:"},{"t":"v","x":["- Jas alpısqa kelgende,","Payǵambar jasqa mingende,","Áwliyege at aytqan,","Shıyıqlarǵa tay aytqan,","Áwliyede túnegen,","Muńlı atam senbediń,","Tilep alǵan bizlerdi,","Joqarıda kóringen?","Bunda saza bolmadı.","On ay qursaq kótergen,","Omırtqası búgilgen,","Qan aralas sút bergen,","Ayazlı kúni aylanıp,","Bultlı kúni buralıp,","Sáhár waqtı bolǵanda,","Jan balam, dep oylanıp,","Muzlı besik tayanǵan,","Enembediń kóringen?","Bunda saza bolmadı.","Talasıp emshek emisken,","Tay qulınday tebiskeń","Tar kursaqta bir jatıp,","Kóp tamasha kórisken,","Jalǵız qarındasım Qansulıw ma?","Bunda saza bolmadı.","Qalmaqqa kelip keyninen,","Qırıq kúnshilik jollardan,","Bayshubardı ozdırıp,","Qalmaqtan alǵan dilbarım,","Barshın ba ediń kóringen?","Bunda saza bolmadı.","Kóterip meni ósirgen,","Bir kamalǵa keltirgen,","Balasınan ayırılıp,","Sergizdan bolǵan keynimde,","Babam Qultaymediń sen?- deydi.","Bunda saza bolmadı.","Taban joldıń awzında,","Qara at júrmey turǵanda,","Attan túsip juwırıp,","Ekewimiz gúres salǵanda,","Tawda jıqtım sizlerdi,","Qorqqanınan dos bolǵan,","Qarajanbediń sen? - deydi.","Ashıwlandı Qarajan:","- Atańdı ayttım, sózim joq,","Eneńdi ayttıń, sózim joq,","Tuwısqanıń Qansulıw,","Qarındasıńdı ayttıń sózim joq.","Kostar degen súyewdi,","Barshındı ayttıń sózim joq,","Qatarda kózge ilmegen,","Toy-mereke bolǵanda,","Keldiń, aǵa, demegen,","Dizesine orın tiymegen,","Qolına suw quymaǵan,","Bes baytalǵa satıp alǵan,","Qultay qul shelli kórmediń,","Úsh ayshılıq shóllerge,","Piyada júrip tentirep,","Elińe barıp esittim,","Qalǵanıńdı zindanda,","Izlep keldim piyada,","Kádirimdi bilmediń,","Qultay qul shelli kórmediń,","Qultay quldan soń ayttıń,","Jawda mingeniń maya ma,","Batır sózden taya ma,","Qultay shelli kórmediń, - dep,","Qarajan ashıwlanıp kete berdi."]},{"t":"v","x":["Alpamıs:","- Sawash kúni at kekilin taraysań,","Óziń batır, hár múshkilge jaraysań,","Men jatırman úsh jıl boldı zindanda,","Qapa bolǵan márttiń nesin sınaysań?"]},{"t":"p","x":"Sol waqıtta Karajan jáne oylanıp qaytıp keldi. Iynindegi tanaptı Alpamısqa tasladı, márt tanaptı usladı, Qarajan jıynadı, jol ortaǵa kelgende, Alpamıs kıyal oyladı, at bası qaǵıspas jer bolmas, ya sawashta, ya urısta, ya gúreste bayaǵı zindannan shıǵarıp alǵan aǵańman, dep júrse, sol waqıtta júzim tómen bolar dep, batır tanaptı sheship túsip ketti. Qarajan óz jónine ketti."}]},{"n":17,"name":"XVII bólim","blocks":[{"t":"p","x":"Bul jatıwdan aradan altı jıl ótti. Altı jılǵa mal shıday ma, Áshim bar qoydı berip boldı. Qanatınan qayrıldı, esapsız qoydan ayrıldı, bererge zatı bolmadı, endi ırazı bol, jora, dep, Alpamıstıń keldi qasına."},{"t":"p","x":"- Ne boldı, jora? - deydi Alpamıs."},{"t":"p","x":"- Ne bolǵanı kurısın, bar qoyımdı jep boldıń, - deydi."},{"t":"p","x":"- Seniń, jora, beretuǵın zatıń bolmasa, saǵan bir ańsat talap bar, - deydi."},{"t":"p","x":"- Ne talap? - deydi."},{"t":"p","x":"Iynińe dorba sal, qolıńa hasa al, qalmaqtıń qalasına bar. Ne jerde tandır bolsa, nan japqan qatın bolsa, neshesine pátiya ber, neshesin alda, qalmaqtıń qatınları seniń túrki tilińe túsinbeydi, kunde nan tilep kele ber, - deydi."},{"t":"v","x":["Áne Áshim:","Iyinine dorba saladı,","Qolına hasa aladı,","Qalmaqtıń qalasına jónedi,","Hár kósheni qıdırdı,","Qıdırıp tandır tappadı,","Áshimge sapar jaqpadı,","Bir kóshege kirdi.","Bálentte qurǵan bir tandır,","Ol kóshede kórindi,","Elli-altmısh qatın basında,","Bir nesheler nan japqan,","Bir nesheler nan jasaǵan,","Jaqınlap bardı qálender:","- Diywanaman, diywanaman,","Íshqına kúyip janaman,","Bir-bir nannan berińler,","Esapsız qoydan ayırılǵan,","Nan tilegen diywanaman.","Júrekten shıqpas ármanım,","Taymaǵay bastan dáwranım,","Bir-bir nannan berińler,","Aman-saw shıqqay palwanım.","Allaǵa jetkey nalıshlar,","Diywanashılıq bul isler,","Bir-bir nannan berińler,","Nan jawıp turǵan biybishler.","Kelse bir ájel qamalar,","Diywana keshse allalar,","Bir-bir nannan berińler,","Nan jasap turǵan mamalar.","Diywanalar, ándiysheler,","Bizlerge túsken pesheler,","Bir-bir nannan berińler,","Tandır basında shesheler.","Shektim jábir-japalar,","Súrgenim zawqı-sapalar,","Bir-bir nannan berińler,","Tandır basında apalar.","Qolımda bar ma tengeler,","Kórinbes sizden óńgeler,","Bir-bir hám nannan berińler,","Tandır basında jeńgeler.","Berregirek kelińler,","Biz benen oynap kúlińler,","Bir-bir nannan berińler,","Tandır basında kelinler.","Baylarman kámar belime,","Tústiń be meniń tilime,","Bir-bir nannan berińler,","Topalań kelgey begińe.","Atlar súrildi dúzlerge,","Kórinbes dushpan kózlerge,","Bir-bir nannan berińler,","Ish burıw tiygey sizlerge."]},{"t":"p","x":"Áshim sózdi tamam qıldı. Qalmaqtıń qatınları túrki tiline túsinbey, ǵayıptan kelgen sayıl eken, pátiyası qabıl eken, bunıń duwasınan qurı qalmayıq dep, kimi bir nan, kimi eki nan, saqıyıraǵı úsh nannan berip atır. Áshimnin qoyını da tolıp atır, dorbası da tolıp atır, bir arqa nan jıynadı."},{"t":"p","x":"Kúnde bir arqa jıynaǵan diywana sirá tına ma, búgin de kiyatır, erteń de kiyatır, bes kún de kiyatır, on kún de kiyatır, bir ay da kiyatır, eki ay da kiyatır,tawıp aldı bir elli-alpıs sada qatındı, basqa tandırdı qıdırmaydı, kúnde sáskede zińkildep keledi de turadı."},{"t":"p","x":"Áwelde tilep aldı, soń-soń qatınlarǵa úyrenise kele, tandırdı panalap barıp, urlap aldı. Ket shirkin, dep túyip jiberedi, ket degen menen ketpeydi, nandı jawıp bolıp, qatınlar tandırdıń basında másláhát etip otıradı ǵoy, sol waqıtta páttelep koyǵan nandı alıp qashatuǵın bir bálege ushıradı. Altı ay búytip awqat etti, bunıń dadı Tayshıxanǵa jetti."},{"t":"p","x":"- Altı ay boldı, bir sayıl kelip, qatınlarǵa nan japtırmaydı, degen ǵalawıt tústi, kimde-kim qalaǵa sayıl kirgizse, ózi ólimdar, malı patshalıq, - dep jar urdırdı. On segiz jerge dárwazaǵa qarawıl qoydırdı. Áshimniń de diywanashılıq jolı baylandı."},{"t":"p","x":"- Alpamıs jora, endi razı bol, - deydi. - Sen de óleseń, men de ólemen, - deydi."},{"t":"v","x":["- Ne boldı, jora? - deydi."]},{"t":"p","x":"- Ne bolǵanı qurısın, xanǵa dańqım túsip, qalaǵa qarawıl qoydırdı, - deydi. - Diywanaǵa jol baylandı."},{"t":"p","x":"- Jora, seniń jáne elmestey ilajıńdı etip beremen, - deydi Alpamıs. - Qalmaqtıń bazarına bar, bir keskir páreńi pıshaq alıp kel, - deydi."},{"t":"p","x":"- Ájep bolar, jora, - dep, Áshim juwırıp-jortıp qalmaqtıń bazarına bardı. Bir shershiden bir páreńi pıshaq alıp ákelip Alpamısqa berdi."},{"t":"p","x":"Alpamıs bir qolı epli, ónerli jigit edi. Bayaǵı semiz qoylardın juqa qabırǵa súyeklerinen qızlar shertetuǵın shıńqobız dúzetti. Zindanda jatıp shertse, qız túwe, Áshimge de jaǵıp qaldı."},{"t":"p","x":"- Bunı saǵan beremen, bunı alıp ket, qalmaqtıń qalasına jet, qalanıń arqasına shıqsań kún shıǵardan kún batarǵa qarap tartılǵan bir góne jap bar, japtı jaǵalap keterseń, xannıń qızı Arzayımnıń baǵı-háreminen boz bulaqqa seyil etip shıǵatuǵın jolınıń ústinde, kópirdiń kún batar shetinde, japtıń arqa betinde, qublaǵa qarap qıysayǵan, túbin saǵal gewlegen, ústin dáltek basqan bir ǵarrı jiyde bar. Soǵan sińip jatsań qırıq qániyzekleri menen Arzayım bulaqqa shıǵar, jaqınlap kelgende bir nama shert, qızlar qarar, taba almas, ras tusıńa kelgen waqıtta ayaǵındı kesekke tirep, jaratqan dep eńirep, ıńırandırıp bir shert."},{"t":"p","x":"Qızlardıń bári qarar, taba almas, aqırında Arzayım aq kúymeden túsip, qızlarǵa darǵazap bolıp, keseklerin awdarttırıp, tastalqan qılıp, seni tawıp alar, - dedi."},{"t":"p","x":"- Bunı kim dúzetti der, ózim dúzettim, degeyseń. Qızlarǵa da urdırar, kálleńdi de tırnar, juqa bastan qan aǵar, ózim dúzettim, dey ber. Sol waqıtta óltiriń dep hámir qılar, onda aytayın, apa, - de. Alpamıs jeti jıl bolǵan eken, saǵan ashıq bolıp shıqqanına de. Mańlayı qara mástan qırıq qız benen zindanǵa salǵan eken. Sonıń jibergen sálemnemesi dep, Arzayımǵa ber de, qayt, - deydi."},{"t":"p","x":"Áshim qobızın alıp, juwırıp qalanıń sırtına shıqtı, qarasa, kún shıǵardan kún batarǵa qarap tartılǵan bir góne jap bar, japtı jaǵalap ketip baratırsa, kópirdiń kún batar shetinde, japtıń arqa betinde, qublaǵa qarap qıysayǵan, túbin saǵal gewlegen, ústin dáltek basqan ǵarrı jiyde bar. Batırdıń aytqan jerine keldim dep, Áshim dáltekke sińip jattı, uyqılap silesi qattı, ármanlıq penen tań attı, kún shıqtı, sáske boldı."},{"t":"p","x":"Qulaq salıp tıńlasa, tum-tustan qońırawdıń sesti kelip tur. Qarasa, aq gómmende, qırıq qızdıń ortasında bir qız kiyatır, maǵan áperetugın Arzayım degen qız usı shıǵar dep, Áshimniń hám waqtı xosh boldı. Batırdıń aytqan jerine keldim dep, ásterek gúńirendirip bir nama shertti, bunı qızlar esitti."},{"t":"v","x":["- Usı jerde bir nárseniń sesti bar, qarań, - dedi."]},{"t":"p","x":"Besewi qaradı, taba almadı. Jaqınlap kelgende bir nama shertti, altawı qaradı, taba almadı. Tusına kelgende ayaǵın kesekke tirep, jaratqan dep eńirep, Áshim sazdı shertti."},{"t":"p","x":"Qızlardıń bárin túsirdi, taba almadı, aqırında Arzayımnıń ózi túsip, keseklerin awdardı, dálteklerin qopartıp, tas-talqan qılıp qaradı. Qarasa, bayaǵı ólim kelgir Áshim kál."},{"t":"v","x":["- Ólim bergir, kál, senbediń? - deydi.","- Awa, apa, men edim, - deydi.","- Bunı kim dúzetti? - deydi.","- Qoydıń keyninde júrip ózim dúzettim, - deydi.","- Ayt ırasın, - deydi.","- Ózim dúzettim, - deydi.","- Urıń, qızlar, - deydi."]},{"t":"p","x":"Qızlar ǵawlap ústine minip qaladı. Bawırına da urıp atır, qarnına da urıp atır, basına da urıp atır, basın tırnap ta atır, juqa bastan qan aǵıp atır, ózim dúzettim dey beredi."},{"t":"v","x":["- Óltiriń qızlar, - deydi.","Sol waqıtta eki qız kegirdeginen ilip alıp edi."]},{"t":"p","x":"- Way-way, aytayın, apa, - deydi. - Batır Alpamıs jeti jıl bolǵan eken, saǵan ashıq bolıp shıqqanına, - deydi. - Mına mańlayı qara mástan qırıq qız benen zindanǵa salǵan eken, sonıń jibergen sálemnaması, - dep, Arzayımga berdi de, qayta berdi."},{"t":"p","x":"Arzayım jeti jastan beri Alpamısqa giriptar ashıq edi, bulaq saparın qoydı, ǵırlap keynine qayttı, atasınıń qasına keldi, atasınan dárbent joldı enshige tilep, atasına tásil salıp, Arzayım ne dep tur eken:"},{"t":"v","x":["- Dáwletińde men súrgenmen saltanat,","Nasharlıqtan ózim boldım biymurat,","Xannıń qızı at kóterdim jasımnan,","Qurbılarım menen qurdım saltanat."]},{"t":"v","x":["Ashılǵan baǵlarda gúlim solmadı,","Ájel jetip paymanamız tolmadı,","Xannıń qızı deydi, ata, xalqıńız,","Men sorlıda hesh bir nıshan bolmadı."]},{"t":"v","x":["Shashgenemdi tallap besten óremen.","Ózim nashar, hár sawdaǵa kónemen,","Bergil ata, dárbent joldı enshige,","Qızlar menen birge dáwran súremen."]},{"t":"v","x":["Qara shashım kemlik penen tarayın,","Nashar basım hár kúnlerge jarayın,","Enshige ber ullı joldı bizlerge,","Dárbent jolǵa kárwan saray salayın.","Patshalıq jol, ata, qarap jatarman,","Sawdagerdiń bajı pulın alayın."]},{"t":"p","x":"Sóytip, Arzayım atasınan dárbent joldı enshige sorap aldı, qasına qırıq qız ertip ketti, bir boz ordanı nar túyege júklep, aman-esen Arzayım toǵız joldıń dárbentindegi patshalıq zindannıń awzına bardı, mamanıń úy qondırǵan jerine a, iymanlı bol, - dep, balań aman kelgey, - dep, «Qultayǵa» pátiyasın berip, Qatınlar dástúrxanların tanıp aldı. «Qultay» bolsa ozıp ketti."},{"t":"p","x":"Qońırattıń bir jabı bar edi, Aqjap dep at beretuǵın edi, qatınlar da tuwra joldan Aqjaptıń boyına jetti. Aylanıp óteyin dese, kópir uzaq, túsip óteyin dese, jap shuqır, sekireyin dese, enlirek, bir tigirek jerge kózi tústi hám tarıraq kórindi. Usı jerden sekirip óteyik, dep másláhát saldı, eki peshin qayırıp, kókiregin ayırıp, ıshtanların sherbenip, kóylegin awızına tislep, balaların iynine salıp, dáslurxanların qolına alıp, keyin sheginip kelip sekirip edi, on altısı ótti. Baqa jawırın, mántirsek, bóksesi juwan, kelte baqayıraq ekewi shomp etip suwǵa battı, suyıq tezekte ne kórgen kún bar, bul da shayılıp ketti, ekewi suwdan shıǵıp, birewi aldında, birewi keyninde ketip baratırsa, «awǵan talǵanǵa kúledi» degen, izgi qatın ózinikinen xabarı joq, aldındaǵı qatınnıń qatlaması shayılıptı, ókshesine, bóksesine, quyrıǵına tamshılap tamıp baratır, oǵan izgi qatın awızın qıysaytıp kúlip baratır:"},{"t":"v","x":["- Toyǵa barsaq, meniń aqlım bolar lal,","Kewlińe kelmesin seniń qıylı qal.","Eglenip tur, ólim bergil biyhaya,","Haw abısın, saǵan aytar arzım bar."]},{"t":"v","x":["Kirippediń erenlerdiń baǵına,","Kúyippediń joqshılıqtıń daǵına,","Ańlamapsań, ólim bergil biydáwlet,","Qatlama pisirippediń zıǵır mayına."]},{"t":"v","x":["Ultan xanlar ullı toydı baslaydı,","Toy bergenler zárre kewlin xoshlaydı,","Ańlamapsań ólim bergil biydáwlet,","Qatlamańız shayılıp ketken usaydı."]},{"t":"v","x":["Toyǵa barsań seniń aqlıń hayrandı,","Bizler menen súre almaysań dáwrandı,","Ańlamapsań ólim bergil biyhaya,","Maylar tamıp ústi basıń wayrandı."]},{"t":"p","x":"Sol waqıtta artına burılıp qarasa, bunıki onnan beter aǵıp baratır. Ekewi de bir ash kisiniń qatını edi."},{"t":"p","x":"- Mańlayımız qurısın, abısınım, endi toyǵa ne betimiz benen baramız. Un tilep alıp, maydı qarız alıp, iylep zordan pisirip edik-aw, - deydi."},{"t":"p","x":"- Usındayda alıspaytuǵın bola ma, analardan qarız ala qoyayıq, - deydi."},{"t":"p","x":"Aldındaǵı qatınlardan ekewi nan qarız sorap baratırǵan kusaydı:"},{"t":"v","x":["- Qáynim ólip, Ultan boldı xanımız,","Toyı qursın, qıynaldı shiyrin janımız,","Bir-bir nannan qarız beriń bizlerge,","Suwǵa batıp, shayılıp ketti nanımız."]},{"t":"v","x":["Qayırıp jaqtım Baysın kóldiń qamısın.,","Jańa bildim toyxananıń alısın,","Biziń nanlar suwǵa batıp ezildi,","Bir-bir nannan qarız beriń abısın."]},{"t":"v","x":["Baylar malın Qarakólge baǵadı,","Jarlılıǵı qursın,eni jaǵadı,","Qatlama pisirgeni qursın zıǵır mayına,","Bóksemizge ıssı-ıssı tamadı."]},{"t":"p","x":"- Biysharalar suwǵa ıǵıp ketip edi, shayılsa, shayılıp ketkendi, bir-bir nannan bersek, bere qoyayıq, - deydi basqaları."},{"t":"p","x":"Másláhát penen dástúrxanların sheship qaradı, ózleriniń suwı menen bular da iylenip qalǵan eken, quday urdı Qultaydı, qaynaǵa bolmasań, teris bol. Qatınlar Aqjaptıń boyına qaytıp kelip, dástúrxanların zordan hadallap aldı."},{"t":"p","x":"«Qultay» ozıp kete berdi. Qultaydıń burınnan kiyatırǵan bir qádirdan aǵası bar edi, qolı eplirek edi, xannıń toyında mal soyatuǵın edi, qassap bola qoyǵan eken, qalada otırsam hár kim jamanlar, góshti kóp aldıń der, xanǵa ólimdar bolıp júremen be dep, qalanıń sırtında, joldın ústinde torańǵıldan ılashıq qılıp otırar edi. Kempiri de Qultaydıń qádirdan jeńgesi edi. Qultayǵa qosıp qoyǵan bes-altı eshki ılaǵı da bar edi. Qultaydı kórip arqası qozdı, kempir moynın sozdı:"},{"t":"p","x":"- Shıraǵım, mırzaǵa, aman-saw júrmiseń? Biziń aq eshki saw ma, sarı eshki saw ma? - dep sorap atır."},{"t":"p","x":"- Zańǵardıń qızı, qay waqıtta maǵan mal qosıp biynaymıt bolıp ediń? Aq eshkiń urǵashı tuwdı, sarı eshkiń egiz tuwdı, qara eshkiń úshew tuwdı, - dep edi, kempir quwanıp ketti."},{"t":"p","x":"Kempir qassapqa kúnde bir qazan sháwle pisirip qoyatuǵın edi. Sháwle pisip tur eken."},{"t":"p","x":"- Jeńge, mına sháwleńnen berseń, jep keteyin, - deydi."},{"t":"p","x":"- Má, shıraǵım, - dep bir shómish alıp berdi. Jep bolıp:"},{"t":"p","x":"- Jáne ber, jeńge, - deydi."},{"t":"p","x":"Jáne bir shómish salıp berdi."},{"t":"p","x":"- Qudaydıń ólimi bergil qul, seniń ushın pisirip atırman ba, - deydi. Kempir shómish penen qoyıp jiberdi. Ras qoyıw olay emes, bılay dep kempirdin kolınan shómishti tartıp aldı."},{"t":"v","x":["Júregińniń awızı dep,","Qos ókpeniń tusı dep,","Óletuǵın jeriń usı dep,"]},{"t":"p","x":"kempirdi bir urıp edi, kempir uzınına jattı, qozǵalmay silesi qattı, kempirdiń ólgenin bildi, eki qatlap kórpeni saldı, dastıǵın bálent qoydı, qublaǵa qarap óz jónine kete berdi. Namazsham qarlıǵıp, quptan bolǵan waqıtta qassap kiyatırǵan kusaydı, dorbası tolı, qoynı da tolı, kúndegiden waqtı xosh. Góshi de kóp, shegirdek, óńesh, ókpe, qırıqqat, jumırı ash ishek - bárin arqalap kiyatır-aw. Mańlayı qara, góshtiń waktı-xoshlıǵı menen kempirge qıshqırıp kiyatır:"},{"t":"v","x":["- Kórgenshe joqtı qararım,","Taymaǵay meniń dáwranım,","Qassap yarıń kiyatır,","Úydemiseń nazlı yarım."]},{"t":"v","x":["Esiktiń keldi aldına,","Bekitiwli esikti kóredi,","Maydanda qassap sóyledi:","-Torańǵıldan ılashıǵım,","Saylap alǵan shın ashıǵım,","Qassap yarıń kelip tur,","Esik ash dilbarım, esik ash."]},{"t":"v","x":["Aqlım hám boldı meniń lal,","Barmedi sende qıylı hal,","Iynimdi dorba taldırdı,","Kempir jan, shıǵıp dorbanı al."]},{"t":"v","x":["Ushırdım kólden ǵazımdı,","Qolıma aldım sazımdı,","Shıqqıl zańǵardıń qızı,","Ólgenshe qoymadıń nazıńdı."]},{"t":"v","x":["Qassaptıń keldi ashıwı,","Narday belińdi búreyin,","Kózińniń jasın tógeyin,","Shıq desem, nege shıqpaysań?!"]},{"t":"v","x":["Esikti buzıp kiredi,","Uzınına jatqan kempirdiń,","Kókiregine tebedi,","Kempirden xabar bolmadı."]},{"t":"v","x":["Kempirin joqlap,","Qassap way-way saladı:","Qanatımnan qayrıldım,","Doynaǵımnan mayrıldım,","Toyıń qursıń Ultan qul, way-way.","Kempir yarımnan ayırıldım,","Toyıńa barıp alǵanım,","Toǵız bawızlaw, bir kóten,","Kempirime keldi tóten,","Kempirim biyjay jattı ma,","Sháwleniń duzın tattı ma,","Íssı jep suyıq sháwleni,","Jumbarshaǵıńa qattı ma?"]},{"t":"p","x":"Qassap way-way salıp tursa, xannan eki jasawıl keldi, mańlayı qara, Ultannıń dáwletinde saǵan kempir qurıy ma, dep qassaptı da quwıp ketti."}]},{"n":21,"name":"XXI bólim","blocks":[{"t":"p","x":"«Qultay» toyxanaǵa jetti, áweli atanı kórmek, eneni kórmek miyras, ata-enemdi kóreyin dep, qalanı aralap barsa, atasınıń baylıqtan tikken boz ordasın aparıp Ultan qul toyxanaǵa alıp ketken eken. Otır eken enesi, bir kórpeniń ishinde, kaq shekpendi jamılıp, Alpamıs jandı saǵınıp. Barıp sálem berdi."},{"t":"p","x":"- Jeńge, aman-saw otırmısań, - deydi, qolınan alıp zıyarat qıldı."},{"t":"p","x":"- Shıraǵım, mırzaǵa, aman-saw júrmiseń? Malıń, janıń aman ba, jetimegiń saw ma? Jalǵızdan xabar bar ma? - dep sorap edi enesi."},{"t":"p","x":"- Jeńge, ishkendey neń bar, ishim ash bolıp kiyatır, - deydi."},{"t":"p","x":"- Tórde turǵan kergige qolıńdı suq, shıraǵım, - deydi."},{"t":"p","x":"Qolın suǵıp qaradı, jumırı, ash ishek, baqay tazalaw enesiniń patshalıqta qılıp turǵan wazıypası sol eken. Mınaw haldı kórip, toyxanaǵa qarap júris qıldı. Baratırsa, atası Baybóri baydıń aq qılqa ústinde, úlken qabaq iyninde, suw tasıp máskepshi bolıptı Ultan xannıń toyında. Qolınan aldı, sálem berdi, tanımadı, atasınan ótip xannıń qasına bardı. Balası tanıtpadı ózin, belli «Qultay» sol boldı, xanǵa barıp sálem berdi. Xan sálemin aldı."},{"t":"p","x":"- Xan inim, qutlı bolsın, toy beripseń, - deydi. - Toyıńa shaqırttıń, kele almadım, qutlı bolsın aytıp qaytayın dep edim, jáne «jetimniń bir toyǵanı shala bayıǵanı» degen, bes-altı kún júrip, patshalıqtıń toyınan toyıp keteyin dep keldim, - dedi."},{"t":"p","x":"- Bárekella aǵa, táwir kelgen ekenseń - deydi. - Asxanaǵa bar, ot jaq, kúl al, suw tası, tamaǵıńdı toydırıp júre ber, - deydi."},{"t":"p","x":"- Ájep bolar, inim, - deydi. Qol qawsırıp, keyin basıp ǵana shıqtı. Maydanǵa shıǵıp oylandı:"},{"t":"p","x":"- Hár kisiniń basına dáwlet kelse, onıń xızmeti ar bolmaydı degen, bul zańǵarǵa kemli kún dáwlet kelgen eken, bunıń xızmetin ar bilmeyin, - deydi."},{"t":"p","x":"Bir qısım kúl aldı, azǵana ot jaqtı, suw tasır qabaq tappadı. Sol waqıtta tús bolıp, Baybóri kempiriniń qasına barǵan eken, izinen barıp, ózin tanıtpay Baybóri baydan qabaǵın sorap turǵan qusaydı:"},{"t":"v","x":["- Baǵda ashılǵan reń gúldey solayın,","Xan buyırsa, xızmetine kóneyin,","Qabaqtı ber, Baybóridey jan aǵa,","Seniń ushın ózim xızmet qılayın."]},{"t":"v","x":["Aq qılqa jarasar kiyseń boyıńa,","Hesh nárse teń kelmes aqıl-oyıńa,","Qabaqtı ber, Baybóridey, jan aǵa,","Suw tasıyın Ultan xannıń toyına."]},{"t":"v","x":["Kóllerden ushırdım aqsha quwımdı,","Júyrik at bilmeydi ullı duwımdı,","Qabaqtı ber, Baybóridey jan aǵa,","Seniń ushın men tasıyın suwındı."]},{"t":"v","x":["-Azǵan Qultay,","Allasına jazǵan Qultay,","Sındırarsań qabaqtı,","Ayırarsań kúnimnen,","Kórermen quldan qorlıqtı,","Qullar qılar zorlıqtı,","Bere almayman qabaqtı,","Kete bershi jónińe, - dep,","Baybóri bawın usladı,","Qultay awızın usladı,","Birewi berman tartadı,","Birewi arman tartadı,","Ekewi tursa tiresip,","Ańlaǵan eken enesi,","Bunı kerip, juwırıp keldi qasına,","Atasına keyis qıldı:","- Hey, aljıǵan, aljıǵan,","Jiberseń boyma qabaqtı,","Baǵda ashılǵan lalanı,","Yad áyleyin allanı,","Ólim bergil iymansız,","Tanımadıń balańdı.","Mingen bir bedew jelgendi,","Qádirińdi qullar neǵıp bilgendi,","Jeti kún boldı emshegim,","Bulaq bolıp iyedi,","Ǵayıp bolǵan perzentiń","Saw-salamat kelgendi."]},{"t":"p","x":"Sol waqıtta Baybóri balasın tanıdı."},{"t":"p","x":"- Perzentim, aman keldiń be, jalǵızım aman keldiń be, - dep, balanıń moyınınan qushaqlap, way-way salıp jıladı."},{"t":"p","x":"- Jılay bermeń, ǵarrılar, meniń kewilim buzılar, qullar xabar tappasın, dos- dushpandı kóreyin dep, ǵarrılardıń kewlin awlap, qabaqtı iynine salıp, quptan waqta yarım qabaq suw apardı."},{"t":"p","x":"Úsh aspazı bar edi, tamaq beriń dep edi, quldıń súyer asın kim berip atır, qay jerde qazanǵa qatqan, iyt jemey jatqan, tekshede qalǵan kúyik qaspaqtı jıynap Qultayǵa berdi. Jemege namıs etti, yarım aqsham waqta xannıń qasına jetti."},{"t":"p","x":"- Xan inim, arzım bar, - deydi."},{"t":"p","x":"- Ne arzıń bar? - deydi."},{"t":"p","x":"- Baybóri bay alıp kelgende toqsan úyli qul edik, - deydi. Bárimizdiń túbimiz bir edi, esiginde gedey boldıq, aǵayinnen júdá boldıq, jas alpısqa kelgende, Alpamıs degen júwernemekti qudaydan tilep alǵanda, jeti jasına kelgende, toqsan úyli quldı tayaqlap oynap edi, júwernemek on toǵız jasına kelgende qalmaqta óldi degenge waqtımız xosh bop júr edi, «erge keldi bir náwbet, jerge keldi bir náwbet», basıma dáwlet aylandı, xanlıq qulǵa keldi dep, «atań murap bolǵansha, jeriń oy bolsın» degen naqıl bar edi, balam, atań Ǵodar qul edi, eneń Gúlshin shorı edi. Haw, bátshaǵar, toy bermek seniń teńiń be edi, - dedi."},{"t":"p","x":"Sol waqtta:"},{"t":"p","x":"- Aǵa, saǵan ne boldı? - deydi."},{"t":"p","x":"- Ne bolǵanı qurısın, maǵan xızmet buyırdıń, ot jaqtım, suw tasıdım, tamaq ber desem, aspazlar tamaq bermeydi, qattı qaspaqtı jıynap maǵan beredi, toyǵa kelip óletuǵın boldım ǵoy, inim, - deydi."},{"t":"p","x":"- Aǵa, bul toyda sen darqansań, - deydi, bátsheǵarlardıń berse, qolınan, bermese, jolınan alıp jey ber, - deydi."},{"t":"p","x":"- Ájep bolar, inim, - deydi. Qol qawsırıp, keyin básip ǵana shıqtı. Toyǵa kelgendegi tilegi de sol edi."},{"t":"p","x":"Yarım aqsham waqtında asxanaǵa bardı, ullı toydıń quralǵan kúni edi. Úsh aspaz úsh qazan maydı kúydirip tur edi, may kúydi me, qam ba, dep qazandı aylanıp, duz taslap tur edi."},{"t":"p","x":"- Hay mańlayı qaralar, ishim ash boldı, tamaq beriń, - deydi."},{"t":"p","x":"- Mańlayı qara qul, jańa jep ketpediń be? - dep, kepkir menen qoyıp kelip jiberdi."},{"t":"p","x":"- Bátsheǵardıń aspazları, qazanǵa duz taslap kórgenshe, kelleńdi tıǵıp kórseń bolmay ma? Eki ayaǵın bir qol menen tutıp, eki qolın bir qolı menen tuttı, kúyip turǵan mayǵa aspazlardıń gellesin tıǵıp-tıǵıp aldı. Awızı-bası ırjıyıp, tula boyı tırjıyıp, aspazlar da qup shermende bolıp óldi. Saqqa júgindirip, bir- birine qaratıp, kepkirdi iyegine tirep:"},{"t":"p","x":"- Bar, tamaǵıńızdı pisire beriń, - dep jónine ketti. Aspazlardın da «waqtı xosh», bir-birine ırjıyısıp kúlip qarap tura berdi."}]},{"n":22,"name":"XXII bólim","blocks":[{"t":"p","x":"«Qultay» kóp úylerdi aralap kete berdi, patshalıqtıń toyı da ullı toy. Eldi qoymay jıydırǵan, toqsan úydi tiktirgen, ol waqıtta patshalıq toyda qız- kelinshek jıyılatuǵın edi, háwjar aytıp, toy baslap, sarpay kiyetuǵın edi. Ultan xannıń bir enesi bar edi, atın Gúlshin shorı deytuǵın edi. Tili de shúljiń, ózi de tutlıqparaq edi."},{"t":"p","x":"Kóp qızlardıń ishinde otırıp, qızlarǵa toy baslań dep mirát etip turǵan qusaydı:"},{"t":"v","x":["-Ayt degennen aytaman, qıyılǵıylay,","Pilte bassham oqtıń oǵı jıyılǵaylay,","Ultan aǵam xan bolıp, toy beygende,","To-to-toy baslasań boyma, qıyılǵıylay."]},{"t":"v","x":["Appaq múyiz aq seykem jol baslaydı,","Anna-sannan ayaǵın biy taslaydı,","To-to-toy baslasań boyma, júweymekley,","Toyǵa kelgen qız bala toy baslaydı."]},{"t":"v","x":["Qız degen toyǵa kelse oynap kúley,","Ashna, yay-dosı kelgende qádiy biley,","To-to-toy baslasań boyma, júweymekley,","Ultan xan aǵań bolsa oyamal beyey."]},{"t":"v","x":["Toyǵa kelgen qıjlaydıń jeńgesi bay,","Toy baslasań boyma, qıyılǵıylay,","Quyı oyamay demeymiz, tengesi bay.","Men bilmeymen toyımnıń enekeshin.","Kelisey me toy beysem meniń ishim,","Óz toyımda otıyman hawjay aytıp,","Usı toyda joq peken-ay biy-biy teńlesim."]},{"t":"v","x":["Sol waqıtta úy artında «Qultay» turıp sóyledi:"]},{"t":"v","x":["-Ayt degennen aytaman áwel ayım,","Alǵan qarap quba ingen shólge qayım,","Tartıp sóyle tilińdi, saqaw Gúlshin,","Úy artına kelip tur Qultay bayıń."]},{"t":"v","x":["Gúlshin:"]},{"t":"v","x":["- Óz jóninde júyey me toydan qaytqan,","Toydan qaytqan jigitley sıynay taytqan,","Háwjay aytıp, toy baslap otıyǵanda,","Kim boladı jıǵında atımdı aytqan?"]},{"t":"v","x":["Qultay: <script>
const D=JSON.parse(document.getElementById('data').textContent).chapters;
const app=document.getElementById('app'),ttl=document.getElementById('ttl'),bar=document.getElementById('bar');
const root=document.documentElement;
let size=19,cur=0;
function sget(k){try{return localStorage.getItem(k)}catch(e){return null}}
function sset(k,v){try{localStorage.setItem(k,v)}catch(e){}}
const th0=sget('ap-theme'); if(th0) root.setAttribute('data-theme',th0);
const sz0=parseInt(sget('ap-size')); if(sz0>=14&&sz0<=30) size=sz0;
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
const words=c=>c.blocks.reduce((a,b)=>a+(b.t==='p'?b.x:b.x.join(' ')).split(/\s+/).length,0);
const mins=c=>Math.max(1,Math.round(words(c)/200))+' daq.';
function go(h){location.hash=h}
function render(){
  const h=location.hash.replace('#','');
  const m=/^bolim-(\d+)$/.exec(h);
  window.scrollTo(0,0);
  if(m&&D[+m[1]-1]){chapter(+m[1])}else{homeView()}
}
function homeView(){
  cur=0;bar.style.width='0';ttl.textContent='Alpamıs';
  app.replaceChildren();
  const hero=el('div','hero');
  hero.append(el('h1',null,'Alpamıs'),el('p',null,'Ógiz jıraw variantı'),el('p',null,'Qallı Ayımbetov tárepinen 1934-jılı jazıp alınǵan'),el('div','orn','✦ ✦ ✦'));
  const cta=el('div','cta');
  const last=parseInt(sget('ap-last'));
  const b1=el('button','primary',last?'Oqıwdı dawam ettiriw — '+last+'-bólim':'Oqıwdı baslaw');
  b1.onclick=()=>go('bolim-'+(last||1));cta.append(b1);
  hero.append(cta);app.append(hero);
  app.append(el('h2','sec','Mazmunı — '+D.length+' bólim'));
  D.forEach(c=>{
    const b=el('button','card'+(sget('ap-done-'+c.n)?' done':''));
    b.append(el('span','n',c.n),el('span','nm',c.name),el('span','m',mins(c)));
    b.onclick=()=>go('bolim-'+c.n);app.append(b);
  });
  app.append(el('div','foot','Alpamıs dástanı · onlayn oqıw nusqası'));
}
function chapter(n){
  cur=n;const c=D[n-1];sset('ap-last',n);
  ttl.textContent=c.name;
  app.replaceChildren();
  const wrap=el('article','ch');wrap.style.fontSize=size+'px';
  wrap.append(el('div','no',n+' / '+D.length),el('h1',null,c.name),el('div','orn','✦'));
  c.blocks.forEach(b=>{if(b.t==='p'){wrap.append(el('p','prose',b.x))}else{const p=el('div','stanza');b.x.forEach(l=>p.append(el('span',null,l)));wrap.append(p)}});
  app.append(wrap,navRow(n),el('div','foot',c.name+' tamam'));
  const sp=parseFloat(sget('ap-pos-'+n));
  if(sp>0.01&&sp<0.98)requestAnimationFrame(()=>window.scrollTo(0,sp*(document.documentElement.scrollHeight-innerHeight)));
}
function navRow(n){
  const r=el('div','nav');
  const p=el('button',null,'← Aldınǵı'),x=el('button','primary',n<D.length?'Keyingi →':'Mazmunı');
  if(n<2)p.disabled=true;
  p.onclick=()=>go('bolim-'+(n-1));
  x.onclick=()=>{sset('ap-done-'+n,'1');go(n<D.length?'bolim-'+(n+1):'')};
  r.append(p,x);return r;
}
let tick=0;
addEventListener('scroll',()=>{
  if(!cur)return;
  const m=document.documentElement.scrollHeight-innerHeight,f=m>0?Math.min(1,scrollY/m):0;

},{passive:true});
addEventListener('hashchange',render);
document.getElementById('home').onclick=()=>go('');
const panel=document.getElementById('panel');

function setSize(d){size=Math.max(14,Math.min(30,size+d));sset('ap-size',size);const a=document.querySelector('.ch');if(a)a.style.fontSize=size+'px'}

};
